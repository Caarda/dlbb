# Updates runs.csv from the speedrun.com API, using cached player and platform info where it exists.

name: Update "runs.csv" and "categories.csv"

on:
  workflow_dispatch:
  # Run daily at 0 UTC (10AM AEST / 7PM EST)
  schedule:
    - cron: '0 0 * * *'
  
permissions:
  contents: write
  
jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Pull latest version
        run: git pull --ff-only origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          
      - name: Fetch new runs
        run: python -u scripts/fetch_new_runs.py

      - name: Update category point values
        run: python -u scripts/update_category_values.py

      - name: Generate leaderboard
        run: python -u scripts/generate_board.py

      - name: Commit updated files
        run: |
          git config user.name "dlbb"
          git config user.email "dlbb@users.noreply.github.com"
          git add output/runs.csv
          git add output/categories.csv
          git add output/board.csv
          git add cache/platforms.csv
          git add cache/players.csv
          if git diff --cached --quiet; then
            echo "no changes; nothing to commit."
          else
            git commit -m "Automated Board Update: $(date +%Y-%m-%d)"
            git push
          fi
